# Konfiguration für das Windows-Programm (npm run dist:win)
appId: de.nexobuilder.app
productName: NexoBuilder
copyright: NexoBuilder
directories:
  output: release
  buildResources: build
files:
  - electron/**
  - dist-single/**
  - build/icon.png
  - package.json
asar: true
# Keine automatischen Updates
publish: null
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NexoBuilder
  artifactName: NexoBuilder-Setup-${version}.exe
portable:
  artifactName: NexoBuilder-${version}-portable.exe
