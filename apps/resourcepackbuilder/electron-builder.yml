# Configuration for the Windows program (npm run dist:win)
appId: de.resourcepackbuilder.app
productName: ResourcepackBuilder
copyright: ResourcepackBuilder
directories:
  output: release
  buildResources: build
# The app has no runtime dependencies: the UI is a static export (out/), the main process and preload script are
# self-contained bundles (electron/dist, built by electron/build.mjs) that include the workspace packages and texts.
files:
  - electron/dist/*.cjs
  - out/**
  - build/icon.png
  - package.json
asar: true
# Automatic updates (electron/src/updater.ts) from the GitHub releases. Only writes the update metadata (app-update.yml
# in the program, latest.yml and the blockmap next to the installer): `dist:win` never publishes, CI uploads the files
# to the release.
publish:
  provider: github
  owner: Kyloschmeilo
  repo: NexoBuilder
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ResourcepackBuilder
  artifactName: ResourcepackBuilder-Setup-${version}.exe
portable:
  artifactName: ResourcepackBuilder-${version}-portable.exe
