name: Build

on:
  push:
  pull_request:
  # One-click release: Actions → Build → "Run workflow"
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub release for the version in apps/resourcepackbuilder/package.json'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows:
    name: Windows app (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ResourcepackBuilder-Windows
          path: apps/resourcepackbuilder/release/*.exe
      - name: Install silently
        shell: pwsh
        run: |
          $setup = Get-ChildItem apps/resourcepackbuilder/release/ResourcepackBuilder-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\ResourcepackBuilder\ResourcepackBuilder.exe"
          if (-not (Test-Path $exe)) { throw "Installation failed: $exe is missing" }
          "APP_EXE=$exe" >> $env:GITHUB_ENV
      - name: Test the installed app
        shell: pwsh
        run: |
          npm install --no-save playwright-core
          node apps/resourcepackbuilder/scripts/test-windows-exe.cjs "$env:APP_EXE" exe-test
      - name: Start the portable version
        shell: pwsh
        run: |
          $portable = Get-ChildItem apps/resourcepackbuilder/release/*-portable.exe | Select-Object -First 1
          Start-Process -FilePath $portable.FullName
          Start-Sleep -Seconds 25
          $running = Get-Process ResourcepackBuilder -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -eq 'ResourcepackBuilder' }
          Get-Process ResourcepackBuilder -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $running) { throw 'The portable version did not open a window' }
          'The portable version starts and shows its window.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-Test
          path: |
            exe-test/*.png
            exe-test/*.txt
            exe-test/downloads/*.zip

  release:
    name: GitHub release
    # On version tags (e.g. v1.0.0) or via "Run workflow" – and only if build and Windows test succeeded
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check version and changelog
        run: |
          version=$(node -p "require('./apps/resourcepackbuilder/package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in apps/resourcepackbuilder/package.json"
            exit 1
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"
          awk -v v="$version" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no \"## $version\" section"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: ResourcepackBuilder-Windows
          path: dist-release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist-release
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists – bump the version in apps/resourcepackbuilder/package.json for a new release"
            exit 1
          fi
          # Creates the tag if it does not exist yet (release via "Run workflow")
          gh release create "$TAG" dist-release/*.exe \
            --target "$GITHUB_SHA" --title "ResourcepackBuilder $TAG" --notes-file release-notes.md
