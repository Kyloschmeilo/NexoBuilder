name: Build

on:
  push:
  pull_request:
  # One-click release: Actions → Build → "Run workflow"
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub release for the version in apps/resourcepackbuilder/package.json'
        type: boolean
        default: true

# Read-only by default; only the release job may write (it creates the tag and the release)
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:encoding
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows:
    name: Windows app (.exe)
    # Lint, type check and tests already ran in the build job; this one only packages and tests the program
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ResourcepackBuilder-Windows
          # latest.yml and the blockmap are what installed programs read to update themselves
          path: |
            apps/resourcepackbuilder/release/*.exe
            apps/resourcepackbuilder/release/*.exe.blockmap
            apps/resourcepackbuilder/release/latest.yml
      - name: Install silently
        shell: pwsh
        run: |
          $setup = Get-ChildItem apps/resourcepackbuilder/release/ResourcepackBuilder-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\ResourcepackBuilder\ResourcepackBuilder.exe"
          if (-not (Test-Path $exe)) { throw "Installation failed: $exe is missing" }
          "APP_EXE=$exe" >> $env:GITHUB_ENV
      - name: Test the installed app
        shell: pwsh
        env:
          # Enables the test-only overrides in electron/src/testHooks.ts
          RESOURCEPACKBUILDER_E2E: '1'
        run: node apps/resourcepackbuilder/scripts/test-windows-exe.cjs "$env:APP_EXE" exe-test
      - name: Start the portable version
        shell: pwsh
        run: |
          $portable = Get-ChildItem apps/resourcepackbuilder/release/*-portable.exe | Select-Object -First 1
          Start-Process -FilePath $portable.FullName
          # The portable exe unpacks the app to a temporary folder and starts it from there: wait for a window of that
          # app (not of the installed one tested above)
          $deadline = (Get-Date).AddSeconds(90)
          $running = $null
          while (-not $running -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 1
            $running = Get-Process ResourcepackBuilder -ErrorAction SilentlyContinue |
              Where-Object { $_.MainWindowTitle -eq 'ResourcepackBuilder' -and $_.Path -and $_.Path -ne $env:APP_EXE }
          }
          Get-Process ResourcepackBuilder, $portable.BaseName -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $running) { throw 'The portable version did not open a window' }
          'The portable version starts and shows its window.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-Test
          path: |
            exe-test/*.png
            exe-test/*.txt
            exe-test/downloads/*.zip

  release:
    name: GitHub release
    # On version tags (e.g. v1.0.0) or via "Run workflow" on main – and only if build and Windows test succeeded
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: [build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check version and changelog
        run: |
          version=$(node -p "require('./apps/resourcepackbuilder/package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in apps/resourcepackbuilder/package.json"
            exit 1
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"
          # Notes = the "## <version>" section (also "## v<version>", "## [<version>]" or "## <version> – <date>")
          awk -v v="$version" '/^## /{h = $2; gsub(/^\[|\]$/, "", h); sub(/^v/, "", h); p = (h == v); next} p' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no (or an empty) \"## $version\" section."
            echo "Rename \"## Unreleased\" to \"## $version\" (and start a new \"## Unreleased\" above it) before releasing."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: ResourcepackBuilder-Windows
          path: dist-release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist-release
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists – bump the version in apps/resourcepackbuilder/package.json for a new release"
            exit 1
          fi
          # Creates the tag if it does not exist yet (release via "Run workflow")
          gh release create "$TAG" dist-release/*.exe dist-release/*.blockmap dist-release/latest.yml \
            --target "$GITHUB_SHA" --title "ResourcepackBuilder $TAG" --notes-file release-notes.md
