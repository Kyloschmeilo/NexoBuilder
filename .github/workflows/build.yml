name: Build

on:
  push:
  pull_request:
  # Release per Knopfdruck: Actions → Build → „Run workflow“
  workflow_dispatch:
    inputs:
      release:
        description: 'GitHub-Release für die Version aus package.json erstellen'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:single
      - run: cp dist-single/index.html NexoBuilder.html
      - uses: actions/upload-artifact@v4
        with:
          name: NexoBuilder
          path: NexoBuilder.html

  windows:
    name: Windows-Programm (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: NexoBuilder-Windows
          path: release/*.exe
      - name: Installer still installieren
        shell: pwsh
        run: |
          $setup = Get-ChildItem release/NexoBuilder-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\NexoBuilder\NexoBuilder.exe"
          if (-not (Test-Path $exe)) { throw "Installation fehlgeschlagen: $exe fehlt" }
          "NEXO_EXE=$exe" >> $env:GITHUB_ENV
      - name: Installiertes Programm testen
        shell: pwsh
        run: |
          npm install --no-save playwright-core
          node scripts/test-windows-exe.cjs "$env:NEXO_EXE" exe-test
      - name: Portable-Version starten
        shell: pwsh
        run: |
          $portable = Get-ChildItem release/*-portable.exe | Select-Object -First 1
          Start-Process -FilePath $portable.FullName
          Start-Sleep -Seconds 25
          $running = Get-Process NexoBuilder -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -eq 'NexoBuilder' }
          Get-Process NexoBuilder -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $running) { throw 'Portable-Version hat kein Fenster geöffnet' }
          'Portable-Version startet und zeigt das Fenster.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-Test
          path: |
            exe-test/*.png
            exe-test/*.txt
            exe-test/downloads/*.zip

  release:
    name: GitHub-Release
    # Bei Versions-Tags (z.B. v1.0.0) oder per „Run workflow“ – und nur, wenn Build und Windows-Test erfolgreich waren
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version und Changelog prüfen
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zur Version $version in package.json"
            exit 1
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"
          awk -v v="$version" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md hat keinen Abschnitt „## $version“"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: NexoBuilder-Windows
          path: dist-release
      - uses: actions/download-artifact@v4
        with:
          name: NexoBuilder
          path: dist-release
      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist-release
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG gibt es schon – für einen neuen Release die Version in package.json erhöhen"
            exit 1
          fi
          # Legt den Tag an, falls es ihn noch nicht gibt (Release per „Run workflow“)
          gh release create "$TAG" dist-release/*.exe dist-release/NexoBuilder.html \
            --target "$GITHUB_SHA" --title "NexoBuilder $TAG" --notes-file release-notes.md
